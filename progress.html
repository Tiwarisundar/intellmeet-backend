<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IntellMeet – Team Progress Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f8f9fa; color: #1a1a1a; min-height: 100vh; }
    .header { background: #fff; border-bottom: 1px solid #e5e7eb; padding: 1rem 2rem; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
    .header-title { font-size: 18px; font-weight: 600; display: flex; align-items: center; gap: 10px; }
    .live-dot { width: 8px; height: 8px; background: #10b981; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
    .live-badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; background: #d1fae5; color: #065f46; font-weight: 500; }
    .sync-btn { font-size: 12px; padding: 6px 14px; border-radius: 99px; border: 1px solid #e5e7eb; background: #fff; cursor: pointer; display: flex; align-items: center; gap: 6px; color: #6b7280; }
    .sync-btn:hover { background: #f3f4f6; }
    .container { max-width: 900px; margin: 0 auto; padding: 2rem 1rem; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 1.5rem; }
    .stat-card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; padding: 1rem 1.25rem; }
    .stat-label { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
    .stat-value { font-size: 26px; font-weight: 600; color: #111827; }
    .stat-sub { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .progress-wrap { background: #e5e7eb; border-radius: 99px; height: 10px; margin-bottom: 1.5rem; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 99px; background: linear-gradient(90deg, #10b981, #059669); transition: width 0.8s ease; }
    .filter-bar { display: flex; gap: 8px; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .filter-btn { font-size: 12px; padding: 5px 14px; border-radius: 99px; border: 1px solid #e5e7eb; background: #fff; cursor: pointer; color: #6b7280; }
    .filter-btn:hover { background: #f3f4f6; }
    .filter-btn.active { background: #10b981; color: #fff; border-color: #10b981; }
    .weeks { display: flex; flex-direction: column; gap: 12px; }
    .week-card { background: #fff; border-radius: 12px; border: 1px solid #e5e7eb; overflow: hidden; }
    .week-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 1.25rem; cursor: pointer; }
    .week-header:hover { background: #f9fafb; }
    .week-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    .week-badge { font-size: 11px; padding: 2px 8px; border-radius: 99px; font-weight: 500; }
    .badge-done { background: #d1fae5; color: #065f46; }
    .badge-active { background: #dbeafe; color: #1e40af; }
    .badge-pending { background: #f3f4f6; color: #6b7280; }
    .week-right { display: flex; align-items: center; gap: 12px; }
    .week-count { font-size: 12px; color: #6b7280; }
    .chevron { font-size: 16px; color: #9ca3af; transition: transform 0.2s; }
    .divider { height: 1px; background: #f3f4f6; }
    .days-grid { padding: 0.75rem 1.25rem; display: flex; flex-direction: column; gap: 6px; }
    .day-row { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; background: #f9fafb; border: 1px solid #f3f4f6; }
    .day-row:hover { border-color: #e5e7eb; }
    .day-num { font-size: 11px; font-weight: 600; color: #9ca3af; min-width: 36px; }
    .day-info { flex: 1; }
    .day-title { font-size: 13px; font-weight: 500; color: #111827; }
    .day-tasks { font-size: 11px; color: #9ca3af; margin-top: 2px; }
    .status-select { font-size: 12px; padding: 4px 8px; border-radius: 8px; border: 1px solid #e5e7eb; background: #fff; cursor: pointer; color: #374151; }
    .status-indicator { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .ind-done { background: #10b981; }
    .ind-active { background: #3b82f6; animation: pulse 2s infinite; }
    .ind-pending { background: #d1d5db; }
    .save-toast { position: fixed; bottom: 1.5rem; right: 1.5rem; background: #111827; color: #fff; padding: 10px 18px; border-radius: 99px; font-size: 13px; display: none; align-items: center; gap: 8px; z-index: 100; }
    .last-updated { font-size: 11px; color: #9ca3af; text-align: center; margin-top: 1rem; }
    @media(max-width: 600px) { .stats-grid { grid-template-columns: repeat(2,1fr); } .header { padding: 0.75rem 1rem; } }
  </style>
</head>
<body>

<div class="header">
  <div class="header-title">
    <div class="live-dot"></div>
    IntellMeet — Team Tracker
    <span class="live-badge">Live</span>
  </div>
  <button class="sync-btn" onclick="loadAndRender()">&#8635; Sync</button>
</div>

<div class="container">
  <div class="stats-grid" id="statsArea"></div>
  <div class="progress-wrap"><div class="progress-fill" id="mainBar" style="width:0%"></div></div>
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filterDays('all',this)">All days</button>
    <button class="filter-btn" onclick="filterDays('done',this)">Completed</button>
    <button class="filter-btn" onclick="filterDays('active',this)">In progress</button>
    <button class="filter-btn" onclick="filterDays('pending',this)">Remaining</button>
  </div>
  <div class="weeks" id="weeksContainer"></div>
  <div class="last-updated" id="lastUpdated"></div>
</div>

<div class="save-toast" id="toast">&#10003; Saved & synced!</div>

<script>
const STORAGE_KEY = 'intellmeet_team_progress';

const DEFAULT_DATA = [
  { week:1, title:"Core backend & authentication", days:[
    { day:1, title:"Project setup", tasks:["MERN boilerplate","MongoDB connection","Folder structure","Git init"], status:"done" },
    { day:2, title:"Authentication routes", tasks:["User model","JWT + refresh tokens","bcrypt password hashing"], status:"done" },
    { day:3, title:"Profile + avatar upload", tasks:["Cloudinary config","Profile update API","Avatar upload","Rate limiting"], status:"done" },
    { day:4, title:"Meeting model + WebRTC", tasks:["Meeting schema","WebRTC setup","Create/Join/Delete meeting API"], status:"done" },
    { day:5, title:"Redis + Socket.io", tasks:["Redis session cache","Socket.io server config"], status:"pending" },
    { day:6, title:"Chat + notifications", tasks:["In-meeting chat","Real-time notifications"], status:"pending" },
    { day:7, title:"Week 1 checkpoint", tasks:["API testing","README update","Git commit"], status:"pending" },
  ]},
  { week:2, title:"Frontend & real-time meeting core", days:[
    { day:8, title:"React 19 setup", tasks:["Vite + TypeScript","shadcn/ui + Tailwind","TanStack Query + Zustand"], status:"pending" },
    { day:9, title:"Auth pages", tasks:["Login page","Signup page","Protected routes"], status:"pending" },
    { day:10, title:"Meeting lobby + video UI", tasks:["Meeting room UI","WebRTC integration"], status:"pending" },
    { day:11, title:"Real-time chat UI", tasks:["In-meeting chat","Typing indicators"], status:"pending" },
    { day:12, title:"Screen sharing + recording", tasks:["Screen share controls","Recording UI"], status:"pending" },
    { day:13, title:"Participant list", tasks:["Live participant list","Mute controls","Presence indicators"], status:"pending" },
    { day:14, title:"Week 2 checkpoint", tasks:["End-to-end meeting test","Bug fixes"], status:"pending" },
  ]},
  { week:3, title:"AI intelligence & collaboration", days:[
    { day:15, title:"AI transcription", tasks:["OpenAI Whisper integration","Live transcription"], status:"pending" },
    { day:16, title:"AI summary + action items", tasks:["Meeting summary API","Action item extraction"], status:"pending" },
    { day:17, title:"Post-meeting dashboard", tasks:["Summaries view","Action items tracking"], status:"pending" },
    { day:18, title:"Team workspace", tasks:["Team boards","Kanban project board"], status:"pending" },
    { day:19, title:"Task management", tasks:["Task from action items","Assignee selection"], status:"pending" },
    { day:20, title:"Notifications system", tasks:["Mentions","Action item alerts"], status:"pending" },
    { day:21, title:"Week 3 checkpoint", tasks:["AI accuracy test","Collaboration flow test"], status:"pending" },
  ]},
  { week:4, title:"Deployment, monitoring & polish", days:[
    { day:22, title:"Docker builds", tasks:["Multi-stage Dockerfile","Frontend + backend images"], status:"pending" },
    { day:23, title:"Kubernetes", tasks:["K8s manifests","Helm chart"], status:"pending" },
    { day:24, title:"CI/CD pipeline", tasks:["GitHub Actions","Test + deploy stages"], status:"pending" },
    { day:25, title:"Cloud deployment", tasks:["AWS / Vercel + Render","Env variables setup"], status:"pending" },
    { day:26, title:"Monitoring", tasks:["Prometheus + Grafana","Sentry error tracking"], status:"pending" },
    { day:27, title:"Load testing + security", tasks:["JMeter load test","OWASP ZAP scan"], status:"pending" },
    { day:28, title:"Final QA + demo", tasks:["Edge case testing","README polish","Demo video"], status:"pending" },
  ]}
];

let projectData = JSON.parse(JSON.stringify(DEFAULT_DATA));
let currentFilter = 'all';

function loadAndRender() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) projectData = JSON.parse(saved);
    else projectData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  } catch(e) {
    projectData = JSON.parse(JSON.stringify(DEFAULT_DATA));
  }
  renderStats();
  renderWeeks();
  const t = localStorage.getItem(STORAGE_KEY + '_time');
  if (t) document.getElementById('lastUpdated').textContent = 'Last updated: ' + new Date(parseInt(t)).toLocaleString();
}

function saveStatus(dayNum, newStatus) {
  projectData.forEach(w => w.days.forEach(d => { if (d.day === dayNum) d.status = newStatus; }));
  localStorage.setItem(STORAGE_KEY, JSON.stringify(projectData));
  localStorage.setItem(STORAGE_KEY + '_time', Date.now());
  renderStats();
  renderWeeks();
  showToast();
}

function showToast() {
  const t = document.getElementById('toast');
  t.style.display = 'flex';
  setTimeout(() => t.style.display = 'none', 2000);
}

function computeStats() {
  let total=0, done=0, active=0;
  projectData.forEach(w => w.days.forEach(d => { total++; if(d.status==='done') done++; if(d.status==='active') active++; }));
  return { total, done, active, pending: total-done-active };
}

function renderStats() {
  const s = computeStats();
  const pct = Math.round((s.done/s.total)*100);
  document.getElementById('mainBar').style.width = pct + '%';
  document.getElementById('statsArea').innerHTML = `
    <div class="stat-card"><div class="stat-label">Overall progress</div><div class="stat-value">${pct}%</div><div class="stat-sub">${s.done} of ${s.total} days</div></div>
    <div class="stat-card"><div class="stat-label">Completed</div><div class="stat-value" style="color:#10b981">${s.done}</div><div class="stat-sub">days done</div></div>
    <div class="stat-card"><div class="stat-label">In progress</div><div class="stat-value" style="color:#3b82f6">${s.active}</div><div class="stat-sub">active days</div></div>
    <div class="stat-card"><div class="stat-label">Remaining</div><div class="stat-value" style="color:#6b7280">${s.pending}</div><div class="stat-sub">days left</div></div>
  `;
}

function renderWeeks() {
  const container = document.getElementById('weeksContainer');
  container.innerHTML = '';
  projectData.forEach((week, wi) => {
    const total = week.days.length;
    const done = week.days.filter(d => d.status==='done').length;
    const active = week.days.filter(d => d.status==='active').length;
    const filteredDays = week.days.filter(d => currentFilter==='all' || d.status===currentFilter);
    if (currentFilter !== 'all' && filteredDays.length === 0) return;
    const allDone = done===total;
    const hasActive = active>0;
    const badgeClass = allDone?'badge-done':hasActive?'badge-active':'badge-pending';
    const badgeText = allDone?'Complete':hasActive?'In progress':'Upcoming';
    const card = document.createElement('div');
    card.className = 'week-card';
    card.innerHTML = `
      <div class="week-header" onclick="toggleWeek(${wi})">
        <div class="week-title">
          &#128197; Week ${week.week} — ${week.title}
          <span class="week-badge ${badgeClass}">${badgeText}</span>
        </div>
        <div class="week-right">
          <span class="week-count">${done}/${total} days</span>
          <span class="chevron" id="chevron-${wi}">&#8964;</span>
        </div>
      </div>
      <div class="divider"></div>
      <div class="days-grid" id="week-days-${wi}">
        ${filteredDays.map(d => `
          <div class="day-row">
            <div class="status-indicator ind-${d.status}"></div>
            <div class="day-num">Day ${d.day}</div>
            <div class="day-info">
              <div class="day-title">${d.title}</div>
              <div class="day-tasks">${d.tasks.join(' &middot; ')}</div>
            </div>
            <select class="status-select" onchange="saveStatus(${d.day}, this.value)">
              <option value="pending" ${d.status==='pending'?'selected':''}>&#9675; Pending</option>
              <option value="active" ${d.status==='active'?'selected':''}>&#9654; In progress</option>
              <option value="done" ${d.status==='done'?'selected':''}>&#10003; Done</option>
            </select>
          </div>
        `).join('')}
      </div>
    `;
    container.appendChild(card);
  });
}

function toggleWeek(wi) {
  const el = document.getElementById(`week-days-${wi}`);
  const ch = document.getElementById(`chevron-${wi}`);
  if (el.style.display==='none') { el.style.display='flex'; ch.style.transform='rotate(0deg)'; }
  else { el.style.display='none'; ch.style.transform='rotate(-90deg)'; }
}

function filterDays(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderWeeks();
}

loadAndRender();
</script>
</body>
</html>
